# ─────────────────────────────────────────────────────────────────────────────
# Your app's manifest. This file IS the app's contract.
#
# Everything Pippa shows a user about your app is generated from this file, and
# the runtime refuses anything you did not declare here. If `outcomes` does not
# list it, your app cannot be asked to do it. If `output` does not name a
# field, returning that field is an error, not a bonus.
#
# That strictness is the point. A user installing your app sees a permission
# screen built from this file, so the file has to be the truth.
#
# Replace everything below with your own app. The example describes a small
# "days until" app so you can see the shape of each part.
# ─────────────────────────────────────────────────────────────────────────────

manifest_version: 1

# Your app keeps nothing between calls. This is not a preference you can
# change — every hackathon app runs with `persistence: none`, and the runtime
# throws away the machine your code ran on when it finishes.
persistence: none

# ── Your public author name ──────────────────────────────────────────────────
#
# EMPTY ON PURPOSE. Claude asks you for it before anything else, and nothing
# publishes until it is filled in (the build says "Nothing to publish yet").
#
# It is the name everybody sees next to your app: "by <name>" on the install
# screen, in the list of apps and on every answer your app gives. So it is
# PUBLIC, and it should be a pseudonym: a made-up name or a nickname, never
# your real name and never an email address. This repository is public too,
# so anyone can read it here as well.
#
# The rules: 3 to 30 characters; letters, numbers, spaces, dots, hyphens and
# underscores; starting with a letter or a number; nothing that looks like an
# email or a web address; and not "pippa", "official" or "verified". Another
# builder cannot use the same name, and you can use yours on all your apps.
#
# It does not decide who owns the app, and nothing in this file does. Pippa
# Labs created this repository for your Pippa account, so every app published
# from it is yours. docs/REVIEW_AND_SHARING.md is the whole story.
app_author_name: "stargazer"

app:
  # Set from the repository name (pippa-hack-app-bc12). Do not change it.
  id: hack.app_bc12
  name: Starspy
  # Bump this (0.1.0 -> 0.1.1) after a version has been submitted for review.
  version: 0.1.0
  # Never use the word "b-y" here: the badge splits on it.
  summary: >-
    Finds where to go stargazing tonight near a UK or Irish town or postcode,
    picking the nearest dark-sky place with clear skies. Also says when it gets
    properly dark and what phase the moon is in. Sends the place name to free
    map and weather services; keeps nothing.

agent_types:
  - personal

outcomes:
  - id: stars.tonight
    summary: Where and whether to see the stars tonight near a place, with darkness times and the moon
    example_phrases:
      - where can i go stargazing near
      - is it a good night for stargazing
      - can i see the stars tonight
      - nearest dark sky park to
      - best place to see the milky way near
      - will it be clear enough to see the stars
      - where is dark enough to see stars near
      - how cloudy will it be for stargazing
      - what time does it get dark enough for stargazing
      - what phase is the moon for stargazing
    inputs:
      - name: place
        type: string
        required: false
        description: >-
          The town, city, village or postcode the person wants to stargaze
          near, exactly as they wrote it (for example "Sheffield", "BS1 4ST"
          or "Keswick"). If the message names no place, return an empty string
          rather than guessing.
      - name: max_distance_km
        type: integer
        required: false
        description: >-
          The furthest the person is willing to travel, in kilometres, only if
          they said so (convert miles to kilometres). Leave this out entirely
          if they did not mention a distance. Never guess one.
    output:
      - name: place_used
        type: string
        description: The place the answer is for, as it was found.
      - name: timezone_used
        type: string
        description: The time zone the clock times are given in.
      - name: dark_from
        type: string
        description: Local clock time (HH:MM) tonight's darkness starts, or now if already dark.
      - name: dark_until
        type: string
        description: Local clock time (HH:MM) it starts getting light again.
      - name: fully_dark
        type: boolean
        description: False when the sun never gets low enough for proper darkness (northern summer).
      - name: moon_phase
        type: string
        description: The moon's phase tonight, such as "waxing crescent".
      - name: moon_illumination_percent
        type: integer
        description: How much of the moon is lit, 0 to 100. Above about 70 washes out faint stars.
      - name: local_cloud_percent
        type: integer
        description: Average cloud cover over the dark hours at the place itself.
      - name: good_night
        type: boolean
        description: True when the best spot's average cloud is below cloud_threshold_percent.
      - name: cloud_threshold_percent
        type: integer
        description: The cloud level below which a spot counts as clear.
      - name: best_spot
        type: string
        description: The recommended dark-sky place, the nearest clear one checked.
      - name: best_spot_type
        type: string
        description: What kind of dark place it is, such as "International Dark Sky Park" or "Known dark spot".
      - name: best_spot_distance_km
        type: number
        description: Straight-line distance from the place to the best spot, in km.
      - name: best_spot_cloud_percent
        type: integer
        description: Average cloud cover over the dark hours at the best spot.
      - name: best_time
        type: string
        description: Local clock time (HH:MM) with the least cloud at the best spot.
      - name: other_spots
        type: array
        item_type: string
        description: Other nearby dark-sky places checked, each with distance and cloud.
      - name: nearby_park
        type: string
        required: false
        description: A closer nature reserve as a backup. Brighter than the dark-sky places. Absent if none found.
      - name: nearby_park_distance_km
        type: number
        required: false
        description: Straight-line distance to the nearby reserve, in km.
      - name: nearby_park_cloud_percent
        type: integer
        required: false
        description: Average cloud cover over the dark hours at the nearby reserve.

# ── API keys your app needs (this example needs none) ────────────────────────
#
# If your app calls an API that needs a key, declare the key here by NAME,
# and never write the key itself in any file:
#
#   app_secrets:
#     - name: OPENWEATHER_API_KEY        # capitals, digits, underscores
#       description: "OpenWeather key, used to look up the forecast"
#       required: true                   # the app cannot answer without it
#
# Your code reads it inside handle() with os.environ["OPENWEATHER_API_KEY"].
# You set the value in Pippa: Apps > Created by me > your app > Keys, and can
# change it there any time without a push. On your computer it comes from a
# file called .env, which git never commits. docs/API_APPS.md, "Using API
# keys", has the rules and an example.
#
# ── Things this example does NOT use ─────────────────────────────────────────
#
# `connectors:` and `secrets:` declare that your app needs somebody's
# credentials — a Google account, for instance. Hackathon apps may not use
# them: registration refuses any app that asks, because granting a stranger's
# app a real user's credential is not something a workshop can consent to on
# a user's behalf. Your app's OWN keys are `app_secrets`, above.
#
# Your app CAN call the public internet (see docs/HOW_PIPPA_APPS_WORK.md).
# This repository is public, so a key in any file here is a key anyone can
# copy: keys only ever go in Pippa and in .env.
